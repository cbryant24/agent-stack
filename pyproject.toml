[project]
name = "agent-stack"
version = "0.0.1"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "ipython>=8.0",
    "pytest-asyncio>=1.4.0",
    "agent-shell[langgraph]",
    "visual-generation[chat]",
    "music-curation[chat]",
]

[tool.uv.sources]
agent-shell = { workspace = true }
visual-generation = { workspace = true }
music-curation = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages"]
