[project]
name = "music-curation"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "agent-runtime",
    "anthropic>=0.40",
    "click>=8.0",
]

[project.optional-dependencies]
# The chat front end. The base install and every one-shot command work without it.
chat = ["agent-shell[langgraph]"]

[project.scripts]
music-curation = "music_curation.cli:cli"

[dependency-groups]
dev = ["import-linter>=2.0"]

[tool.uv.sources]
agent-runtime = { workspace = true }
agent-shell = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_curation"]

[tool.importlinter]
root_package = "music_curation"
include_external_packages = true

# Everything in music_curation except chat/ stays free of agent_shell, and nothing outside
# chat/ imports chat/. New modules are covered automatically (the whole package is the source).
[[tool.importlinter.contracts]]
name = "only music_curation.chat may use agent_shell or be imported by the rest"
type = "forbidden"
source_modules = ["music_curation.*"]
forbidden_modules = ["agent_shell", "music_curation.chat"]
allow_indirect_imports = true
ignore_imports = [
    # chat/ is the layer that is allowed to use agent_shell and to import itself
    "music_curation.chat.** -> agent_shell",
    "music_curation.chat.** -> music_curation.chat.**",
    # the one hook: cli.py imports the chat entry lazily, inside the `chat` command
    "music_curation.cli -> music_curation.chat.cli",
]
