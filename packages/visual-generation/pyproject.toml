[project]
name = "visual-generation"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "agent-runtime",
    "click>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The chat front end. The base install and every one-shot command work without it.
chat = ["agent-shell[langgraph]"]

[project.scripts]
visual-generation = "visual_generation.cli:cli"
visual-agent = "visual_generation.cli:chat_entry"

[dependency-groups]
dev = ["import-linter>=2.0"]

[tool.uv.sources]
agent-runtime = { workspace = true }
agent-shell = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_generation"]

[tool.importlinter]
root_package = "visual_generation"
include_external_packages = true

# Everything in visual_generation except chat/ stays free of agent_shell, and nothing outside
# chat/ imports chat/. New modules are covered automatically (the whole package is the source).
[[tool.importlinter.contracts]]
name = "only visual_generation.chat may use agent_shell or be imported by the rest"
type = "forbidden"
source_modules = ["visual_generation.*"]
forbidden_modules = ["agent_shell", "visual_generation.chat"]
allow_indirect_imports = true
ignore_imports = [
    # chat/ is the layer that is allowed to use agent_shell and to import itself
    "visual_generation.chat.** -> agent_shell",
    "visual_generation.chat.** -> visual_generation.chat.**",
    # the one hook: cli.py imports the chat entry lazily, inside the `chat` command
    "visual_generation.cli -> visual_generation.chat.cli",
]
